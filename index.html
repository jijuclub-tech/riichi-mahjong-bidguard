<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리치 마작 - 4인 대국</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111; color: #eee; min-height: 100vh; }
.header { background: #1a1a1a; padding: 16px; text-align: center; border-bottom: 1px solid #333; }
.header h1 { font-size: 22px; }
.time-slots { display: flex; gap: 12px; padding: 16px; justify-content: center; flex-wrap: wrap; }
.slot { background: #222; border: 2px solid #333; border-radius: 12px; padding: 16px 24px; text-align: center; min-width: 180px; cursor: pointer; }
.slot.active { border-color: #4a9; background: #1a3a2a; }
.slot h3 { margin-bottom: 6px; }
.lobby { padding: 20px; max-width: 800px; margin: 0 auto; }
.players { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0; }
.player { background: #1e1e1e; border-radius: 10px; padding: 14px; display: flex; align-items: center; gap: 12px; }
.player.ai { opacity: 0.7; }
.avatar { width: 48px; height: 48px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.status { margin-left: auto; font-size: 13px; color: #4a9; }
.btn { background: #2a6a3a; color: white; border: none; padding: 14px 28px; border-radius: 10px; font-size: 16px; cursor: pointer; display: block; margin: 20px auto; }
.btn:disabled { background: #333; cursor: not-allowed; }
.real-match { background: #1a2a1a; border: 2px solid #4a9; border-radius: 12px; padding: 16px; margin: 20px auto; max-width: 500px; text-align: center; }
.real-match h3 { color: #4a9; margin-bottom: 8px; }
.game-area { display: none; padding: 16px; }
.table { background: #0a3a1a; border: 8px solid #5a3a1a; border-radius: 16px; min-height: 400px; padding: 20px; position: relative; }
.hand { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
.tile { width: 42px; height: 58px; background: #fff8e8; border: 2px solid #c0a080; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; opacity: 0.7; }
.tile.recommended { opacity: 1; background: #fff3c4; border-color: #ffd700; border-width: 3px; box-shadow: 0 0 16px #ffd700; transform: translateY(-10px) scale(1.1); animation: pulse 1s infinite; z-index: 2; position: relative; }
@keyframes pulse { 50% { box-shadow: 0 0 24px #ffd700; } }
.info-bar { background: #1a1a1a; padding: 10px 16px; display: flex; justify-content: space-between; margin-bottom: 12px; border-radius: 8px; }
.fee-notice { background: #2a1a1a; border: 1px solid #6a3a2a; border-radius: 10px; padding: 12px; text-align: center; margin: 16px auto; max-width: 400px; font-size: 14px; }
</style>
</head>
<body>
<div class="header">
  <h1>리치 마작 · 4인 대국</h1>
  <p style="font-size:14px; opacity:0.7; margin-top:4px;">점심 12:30 · 저녁 20:00~22:00</p>
</div>

<div class="time-slots">
  <div class="slot" onclick="selectSlot(this, 'lunch')">
    <h3>점심 대국</h3>
    <div>12:30 ~ 13:00</div>
    <div style="font-size:12px; margin-top:4px; color:#4a9;">4인</div>
  </div>
  <div class="slot" onclick="selectSlot(this, 'dinner')">
    <h3>저녁 대국</h3>
    <div>20:00 ~ 22:00</div>
    <div style="font-size:12px; margin-top:4px; color:#4a9;">4인</div>
  </div>
  <div class="slot" onclick="selectSlot(this, 'practice')">
    <h3>1인 연습</h3>
    <div>언제든지</div>
    <div style="font-size:12px; margin-top:4px; color:#4a9;">AI 상대</div>
  </div>
</div>

<div class="lobby" id="lobby">
  <h2 style="text-align:center; margin-bottom:8px;">대기실</h2>
  <p style="text-align:center; opacity:0.6; font-size:14px;">4명이 모이면 시작됩니다. 부족하면 AI가 참여합니다.</p>
  
  <div class="players" id="players">
    <div class="player"><div class="avatar">나</div><div>나</div><div class="status">준비</div></div>
    <div class="player"><div class="avatar">👤</div><div>대기자 1</div><div class="status">대기</div></div>
    <div class="player"><div class="avatar">👤</div><div>대기자 2</div><div class="status">대기</div></div>
    <div class="player ai" id="aiSlot"><div class="avatar">🤖</div><div>AI (초급)</div><div class="status">대기</div></div>
  </div>

  <div class="fee-notice">처음 이용 시 입장료 <strong>100원</strong></div>

  <div class="real-match">
    <h3>실전대결 · 월 1회</h3>
    <p style="font-size:14px; opacity:0.8; margin:8px 0;">특정 식당/호텔에서 오프라인 대국</p>
    <p style="font-size:13px; color:#4a9;">최근 30일 점수 상위 6명 선발 (10판 이상)</p>
    <button class="btn" onclick="showRealMatch()" style="margin-top:12px; padding:10px 20px; font-size:14px;">이번 달 실전대결 보기</button>
  </div>

  <button class="btn" id="startBtn" onclick="startGame()" disabled>100원 내고 시작</button>
</div>

<div class="game-area" id="gameArea">
  <div class="info-bar">
    <span id="roundInfo">동풍전</span>
    <span id="score">25,000</span>
  </div>
  <div class="table">
    <div id="guide" style="background:#1a2a1a; border:1px solid #4a9; border-radius:10px; padding:12px; margin-bottom:16px; text-align:center; color:#ffd700; font-size:13px; line-height:1.6;"></div>
    <div style="text-align:center; opacity:0.5; margin-bottom:12px;">테이블</div>
    <div class="hand" id="hand"></div>
  </div>
  <div style="text-align:center; margin-top:16px;">
    <button class="btn" id="discardBtn" onclick="discard()">버리기</button>
    <button class="btn" id="autoBtn" onclick="autoDiscard()" style="background:#4a6a2a; display:none; margin-top:8px;">추천대로 버리기</button>
    <button class="btn" onclick="riichi()" style="background:#6a3a2a; margin-top:8px;">리치</button>
  </div>
</div>

<script>
const TILES = 'ἀ7ἀ8ἀ9ἀaἀbἀcἀdἀeἀfἁ9ἁaἁbἁcἁdἁeἁfἂ0ἂ1ἁ0ἁ1ἁ2ἁ3ἁ4ἁ5ἁ6ἁ7ἁ8ἀ0ἀ1ἀ2ἀ3ἀ6ἀ5ἀ4'.split('');
let currentSlot = null;
let hand = [];
let selected = -1;
let score = 25000;
let isRiichi = false;
let isBeginner = true;
let recommendIndex = -1;

function recommendTile() {
  if (!isBeginner || hand.length === 0) return;
  const counts = {};
  hand.forEach(t => counts[t] = (counts[t] || 0) + 1);
  let best = -1;
  let reason = '';
  for (let i = 0; i < hand.length; i++) {
    if (counts[hand[i]] === 1) {
      best = i;
      reason = '혼자 있는 패라 버리기 좋습니다.';
      break;
    }
  }
  if (best === -1) {
    best = 0;
    reason = '일단 이 패를 버리는 것을 추천합니다.';
  }
  recommendIndex = best;

  const pairs = Object.values(counts).filter(c => c >= 2).length;
  const triples = Object.values(counts).filter(c => c >= 3).length;
  let situation = '현재 손패: ';
  if (pairs > 0) situation += pairs + '개의 짝(쌍)이 있습니다. ';
  if (triples > 0) situation += triples + '개의 3장 세트가 있습니다. ';
  if (pairs === 0 && triples === 0) situation += '아직 세트나 짝이 없습니다. ';
  situation += '화료에 가까워지려면 같은 패 3장(퐁)이나 연속 패(치)를 만드는 게 유리합니다.';

  const guide = document.getElementById('guide');
  if (guide) {
    guide.innerHTML = 
      '<div style="margin-bottom:6px;"><b>현재 상황</b><br>' + situation + '</div>' +
      '<div style="background:#2a3a1a; padding:10px; border-radius:8px; margin-top:6px; border:1px solid #ffd700;">' +
      '<b style="color:#ffd700;">AI 추천 패</b><br>' +
      '<span style="font-size:24px;">' + hand[best] + '</span><br>' +
      '<span style="opacity:0.9; font-size:12px;">' + reason + '</span></div>';
  }
}

function selectSlot(el, slot) {
  document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  currentSlot = slot;
  if (slot === 'practice') {
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').textContent = '100원 내고 1인 연습 시작';
    document.querySelectorAll('.player')[1].querySelector('.status').textContent = 'AI';
    document.querySelectorAll('.player')[2].querySelector('.status').textContent = 'AI';
    document.getElementById('aiSlot').querySelector('.status').textContent = 'AI';
  } else {
    simulatePlayers();
  }
}

function showRealMatch() {
  alert(
    '실전대결 안내\\n\\n' +
    '【선정 기준】\\n' +
    '• 최근 30일 온라인 대국 점수 상위 6명\\n' +
    '• 최소 대국 횟수: 10판 이상\\n' +
    '• 리치 선언 및 화료 경험 있는 자 우선\\n' +
    '• 동점 시 최근 화료 횟수가 많은 순\\n\\n' +
    '【진행】\\n' +
    '• 월 1회, 사전 공지\\n' +
    '• 장소: 지정 식당/호텔\\n' +
    '• 6명 → 2팀(3명씩)으로 대국\\n' +
    '• 초대 확정 후 참가비 별도'
  );
}

function simulatePlayers() {
  setTimeout(() => {
    const players = document.querySelectorAll('.player');
    players[1].querySelector('.status').textContent = '준비';
    players[2].querySelector('.status').textContent = '준비';
    document.getElementById('aiSlot').querySelector('.status').textContent = '참여';
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').textContent = '100원 내고 게임 시작';
  }, 1500);
}

function startGame() {
  if (!confirm('처음 이용 입장료 100원을 결제하시겠습니까?')) return;
  alert('100원 결제 완료\\n\\n초보 모드: 룰을 설명하면서 진행합니다.');
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('gameArea').style.display = 'block';
  document.getElementById('roundInfo').textContent = 
    currentSlot === 'practice' ? '1인 연습 (AI 상대 · 초보)' :
    currentSlot === 'lunch' ? '점심 동풍전 (초보)' : '저녁 한장전 (초보)';
  if (isBeginner) document.getElementById('autoBtn').style.display = 'block';
  deal();
}

function autoDiscard() {
  if (recommendIndex < 0) return;
  selected = recommendIndex;
  renderHand();
  setTimeout(discard, 300);
}

function deal() {
  const wall = [...TILES, ...TILES, ...TILES, ...TILES];
  for (let i = wall.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [wall[i], wall[j]] = [wall[j], wall[i]];
  }
  hand = wall.slice(0, 14);
  renderHand();
  recommendTile();
}

function renderHand() {
  const el = document.getElementById('hand');
  el.innerHTML = '';
  hand.forEach((t, i) => {
    const div = document.createElement('div');
    div.className = 'tile' + (selected === i ? ' selected' : '') + (recommendIndex === i ? ' recommended' : '');
    div.textContent = t;
    div.onclick = () => { selected = i; renderHand(); };
    el.appendChild(div);
  });
}

function discard() {
  if (selected < 0) return alert('패를 선택하세요');
  hand.splice(selected, 1);
  selected = -1;
  recommendIndex = -1;
  setTimeout(() => {
    if (hand.length < 14) hand.push(TILES[Math.floor(Math.random()*TILES.length)]);
    renderHand();
    recommendTile();
  }, 600);
  renderHand();
}

function riichi() {
  if (isRiichi) return;
  isRiichi = true;
  score -= 1000;
  document.getElementById('score').textContent = score.toLocaleString();
  alert(isBeginner ? '리치 선언\\n\\n룰: 화료에 가까운 상태에서 리치를 선언하면 점수가 높아집니다. 1000점이 차감됩니다.' : '리치 선언');
}
</script>
</body>
</html>
